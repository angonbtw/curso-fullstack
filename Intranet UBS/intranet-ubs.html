<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Intranet UBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-principal: #285C4D;
            --color-acento: #D4C19C;
            --color-fondo: #f4f6f9;
            --color-texto: #222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans', sans-serif;
            background: var(--color-fondo);
            color: var(--color-texto);
        }

        header {
            background: var(--color-principal);
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        header span {
            font-size: 13px;
            color: var(--color-acento);
        }

        .contenedor {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .filtros {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filtros select, .filtros input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .resumen {
            font-size: 13px;
            color: #666;
            margin-left: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        thead {
            background: var(--color-principal);
            color: white;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
        }

        td {
            padding: 11px 16px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f0f4ff; }

        .badge {
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
        }

        .operativa { background: #d4edda; color: #1a6b2f; }
        .no-operativa { background: #f8d7da; color: #842029; }
        .tarjetas-resumen {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
}

.tarjeta-stat {
    background: white;
    border-radius: 10px;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    min-width: 160px;
}

.stat-numero {
    font-size: 28px;
    font-weight: 700;
    color: var(--color-principal);
}

.stat-numero.verde { color: #1a6b2f; }
.stat-numero.rojo { color: #842029; }

.stat-label {
    font-size: 12px;
    color: #888;
}    
.paginacion {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    justify-content: center;
}

.paginacion button {
    background: var(--color-principal);
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.paginacion button:disabled {
    background: #ccc;
    cursor: not-allowed;
}
  </style>
</head>
<body>

<header>
        <div>
        <h1>Intranet UBS — Directorio de Sucursales</h1>
        <span>Sistema interno de gestión de sucursales</span>
    </div>
</header>

<div class="contenedor">
    <div class="filtros">
        <input type="text" id="buscador" placeholder="🔍 Buscar sucursal...">
        <select id="filtroEntidad">
            <option value="">Todas las entidades</option>
        </select>
        <label class="toggle-label">
            <input type="checkbox" id="toggleNoOperativas" checked>
            Mostrar no operativas
        </label>
        <span class="resumen" id="resumen"></span>
    </div>
<div class="tarjetas-resumen">
    <div class="tarjeta-stat">
        <span class="stat-numero" id="totalSucursales">0</span>
        <span class="stat-label">Total sucursales</span>
    </div>
    <div class="tarjeta-stat">
        <span class="stat-numero verde" id="totalOperativas">0</span>
        <span class="stat-label">Operativas</span>
    </div>
    <div class="tarjeta-stat">
        <span class="stat-numero rojo" id="totalNoOperativas">0</span>
        <span class="stat-label">No operativas</span>
    </div>
</div>
    <table>
        <thead>
            <tr>
                <th>CC</th>
                <th>Nombre</th>
                <th>Formato</th>
                <th>Entidad</th>
                <th>Municipio</th>
                <th>Estatus</th>
            </tr>
        </thead>
        <tbody id="tablaSucursales"></tbody>
    </table>
<div class="paginacion">
    <button id="btnAnterior" onclick="paginaActual--; cargar()">← Anterior</button>
    <button id="btnSiguiente" onclick="paginaActual++; cargar()">Siguiente →</button>
</div>

</div>

<script>
const selectEntidad = document.getElementById("filtroEntidad");
let paginaActual = 1;
const LIMITE = 50;
let cargando = false;
let totalCargado = 0;
let totalGeneral = 0;

const renderFila = (s) => {
    const esOp = s.estatus === "OPERATIVAS";
    return `
        <tr>
            <td>${s.cc}</td>
            <td>${s.nombre}</td>
            <td>${s.formato}</td>
            <td>${s.entidad}</td>
            <td>${s.municipio}</td>
            <td><span class="badge ${esOp ? 'operativa' : 'no-operativa'}">${s.estatus}</span></td>
        </tr>
    `;
};

const buscar = () => {
    paginaActual = 1;
    totalCargado = 0;
    document.getElementById("tablaSucursales").innerHTML = "";
    cargar();
};

const cargar = () => {
    const busqueda = document.getElementById("buscador").value;
    const entidad = selectEntidad.value;
    const mostrarNoOp = document.getElementById("toggleNoOperativas").checked;
    const estatus = mostrarNoOp ? '' : 'OPERATIVAS';

    const url = `http://localhost:3000/api/sucursales?pagina=${paginaActual}&limite=${LIMITE}&busqueda=${busqueda}&entidad=${entidad}&estatus=${estatus}`;

    fetch(url)
        .then(res => res.json())
        .then(respuesta => {
            totalGeneral = respuesta.total;

            const tbody = document.getElementById("tablaSucursales");
            tbody.innerHTML = "";

            respuesta.datos.forEach(s => {
                tbody.innerHTML += renderFila(s);
            });

            document.getElementById("resumen").textContent = 
                `Página ${paginaActual} — ${respuesta.datos.length} de ${totalGeneral} sucursales`;
            
            document.getElementById("btnAnterior").disabled = paginaActual === 1;
            document.getElementById("btnSiguiente").disabled = 
                paginaActual * LIMITE >= totalGeneral;
        });
};

// Cargar entidades para el filtro
fetch('http://localhost:3000/api/resumen')
    .then(res => res.json())
    .then(data => {
        document.getElementById("totalSucursales").textContent = data.total;
        document.getElementById("totalOperativas").textContent = data.operativas;
        document.getElementById("totalNoOperativas").textContent = data.noOperativas;

        Object.keys(data.porEntidad).sort().forEach(entidad => {
            const option = document.createElement("option");
            option.value = entidad;
            option.textContent = entidad;
            selectEntidad.appendChild(option);
        });
    });

document.getElementById("buscador").addEventListener("input", buscar);
selectEntidad.addEventListener("change", buscar);
document.getElementById("toggleNoOperativas").addEventListener("change", buscar);

cargar();
</script>

</body>
</html>
